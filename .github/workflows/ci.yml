name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build InvoiceManager.csproj -c Release

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoicemanager .
      - name: Arranque del contenedor
        run: |
          docker run -d --name app -p 8080:8080 invoicemanager
          for i in $(seq 1 40); do curl -fs localhost:8080/health && break; sleep 2; done
          curl -fs localhost:8080/ | grep -q "Panel"
      - name: Capturas de pantalla
        if: always()
        run: |
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          node .github/scripts/screenshots.js shots
      - name: Auditoría funcional (páginas, flujos de factura y validaciones)
        if: always()
        run: python3 .github/scripts/audit.py
      - name: Publicar capturas en una referencia de CI
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q && git checkout -q -b capturas
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/ci/capturas
      - name: Logs del contenedor
        if: always()
        run: docker logs app 2>&1 | grep -E "fail:|Exception|error" | head -40 || true
